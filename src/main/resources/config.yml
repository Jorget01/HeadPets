settings:
  language:
    # auto -> based on player locale (ru_* => ru, else en)
    # fixed -> always use `fixed`
    mode: auto
    fixed: ru
    # if true, player can override (stored in data.yml)
    allow-player-override: true

menu:
  # Show pets without permission in "All pets" tab
  show-locked-in-all: true
  gui:
    size: 54
    frame:
      enabled: true
      material: LIME_STAINED_GLASS_PANE
    slots:
      tab-all: 0
      tab-mine: 1
      filter-all: 3
      filter-with-effects: 4
      filter-without-effects: 5
      particles: 49
      page-prev: 45
      page-info: 51
      page-next: 53
    items:
      tab-selected: EMERALD_BLOCK
      tab-unselected: CYAN_STAINED_GLASS_PANE
      particles: BLAZE_POWDER
      nav: ARROW
      page-info: PAPER
      empty: PAPER
    grid:
      # area where pets are rendered (default is 4 rows x 7 cols like classic GUI)
      start-row: 2
      start-col: 2
      rows: 4
      cols: 7

follow:
  period-ticks: 2
  back-distance: 1.15
  height: 1.2
  close-distance: 2.1
  step-size: 0.6
  teleport-distance: 24.0

particles:
  enabled: true
  # all | owner
  visibility: all
  # vertical offset from pet entity location to spawn particles (armorstand head)
  y-offset: 1.0
  # allow players to select particles per pet (stored in data.yml)
  per-pet-selection: true
  # allow players to disable particles for themselves (stored in data.yml)
  allow-player-disable: true
  delay-ticks: 10
  period-ticks: 6
  count: 2
  offset-x: 0.25
  offset-y: 0.25
  offset-z: 0.25
  extra: 0.0
  options:
    - id: end_rod
      particle: END_ROD
      display:
        ru: "Эндер-искра"
        en: "End Rod"
    - id: heart
      particle: HEART
      display:
        ru: "Сердечки"
        en: "Hearts"
    - id: enchant
      particle: ENCHANT
      display:
        ru: "Чары"
        en: "Enchants"
    - id: happy
      particle: HAPPY_VILLAGER
      display:
        ru: "Счастье"
        en: "Happy"
    - id: cloud
      particle: CLOUD
      display:
        ru: "Облачко"
        en: "Cloud"
    - id: crit
      particle: CRIT
      display:
        ru: "Криты"
        en: "Crit"

# Passive potion effects while a pet is active.
effects:
  enabled: true
  period-ticks: 40
  duration-ticks: 80
  remove-on-deactivate: true

# Add pets here. You can add more entries.
# Tips:
# - `permission` is optional (default: pats.pets.<id>)
# - `display` can be a string (same for ru/en) or a map {ru/en}
# - `effects` can be written as maps OR shorthand strings like "SPEED:0"
pets-settings:
  # How many pets a player can have active at once
  max-active-per-player: 3

